# Lalcha POS. Installed as /etc/nginx/sites-available/lalcha by ops/deploy.sh.
# Cloudflare sits in front; the origin certificate below is trusted only by Cloudflare.

upstream lalcha_api { server 127.0.0.1:8787; keepalive 16; }

# Only Cloudflare (and this server itself) may reach Lalcha here. Anyone who finds the server's own
# address and skips Cloudflare gets the connection closed, so its protection can't be sidestepped.
geo $realip_remote_addr $lalcha_allowed {
  default 0;
  127.0.0.0/8 1; ::1 1; 172.16.0.0/12 1;
  include /etc/nginx/snippets/lalcha-own-ips.conf;
  # https://www.cloudflare.com/ips/
  173.245.48.0/20 1; 103.21.244.0/22 1; 103.22.200.0/22 1; 103.31.4.0/22 1; 141.101.64.0/18 1;
  108.162.192.0/18 1; 190.93.240.0/20 1; 188.114.96.0/20 1; 197.234.240.0/22 1; 198.41.128.0/17 1;
  162.158.0.0/15 1; 104.16.0.0/13 1; 104.24.0.0/14 1; 172.64.0.0/13 1; 131.0.72.0/22 1;
  2400:cb00::/32 1; 2606:4700::/32 1; 2803:f800::/32 1; 2405:b500::/32 1; 2405:8100::/32 1; 2a06:98c0::/29 1; 2c0f:f248::/32 1;
}

server {
  listen 80;
  listen [::]:80;
  server_name lalcha.com www.lalcha.com *.lalcha.com;
  if ($lalcha_allowed = 0) { return 444; }
  return 301 https://$host$request_uri;
}

# The public website, signup and login.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name lalcha.com www.lalcha.com;
  ssl_certificate     /etc/nginx/tls/lalcha/origin.pem;
  ssl_certificate_key /etc/nginx/tls/lalcha/origin.key;
  include /etc/nginx/snippets/lalcha-cloudflare.conf;

  if ($host = www.lalcha.com) { return 301 https://lalcha.com$request_uri; }

  root /srv/lalcha/app/apps/web/dist;
  include /etc/nginx/snippets/lalcha-site-headers.conf;

  # Postal posts incoming mail here with a secret in the URL, so this path is never logged.
  location /v1/mail/ {
    access_log off;
    client_max_body_size 25m;
    proxy_pass http://lalcha_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
  }
  location /v1/ {
    client_max_body_size 3m;
    include /etc/nginx/snippets/lalcha-proxy.conf;
  }
  # For an outside uptime check: answers only when the API itself is up.
  location = /health {
    access_log off;
    include /etc/nginx/snippets/lalcha-proxy.conf;
  }
  location / {
    try_files $uri $uri/index.html $uri/ =404;
  }
  error_page 404 /404.html;
}

# Every store (name.lalcha.com), the demo, and admin.lalcha.com: the till app plus its API.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name *.lalcha.com;
  ssl_certificate     /etc/nginx/tls/lalcha/origin.pem;
  ssl_certificate_key /etc/nginx/tls/lalcha/origin.key;
  include /etc/nginx/snippets/lalcha-cloudflare.conf;

  root /srv/lalcha/app/apps/pos/dist;
  client_max_body_size 3m;
  include /etc/nginx/snippets/lalcha-store-headers.conf;

  location ~ ^/(v1|products)/ {
    include /etc/nginx/snippets/lalcha-proxy.conf;
  }
  # Hashed build files never change, so they can be cached for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/lalcha-store-headers.conf;
    try_files $uri =404;
  }
  # The service worker and page shell must be checked on every visit, so updates arrive.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/lalcha-store-headers.conf;
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/lalcha-store-headers.conf;
    try_files $uri /index.html;
  }
}
