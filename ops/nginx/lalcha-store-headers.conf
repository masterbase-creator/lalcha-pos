# Store addresses (name.lalcha.com), the demo and the admin panel.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# A shop's till is private: search engines are asked to leave store addresses out.
add_header X-Robots-Tag "noindex, nofollow" always;
# The till uses the camera for barcodes and USB, serial or Bluetooth for receipt printers; nothing else.
add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), camera=(self), usb=(self), serial=(self), bluetooth=(self)" always;
# Scripts only from the store's own address (plus the on-device database, which is WebAssembly).
# Only the Lalcha website may show a store inside a frame (the live demo on the homepage).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'self' https://lalcha.com; base-uri 'self'; form-action 'self'; object-src 'none'" always;
