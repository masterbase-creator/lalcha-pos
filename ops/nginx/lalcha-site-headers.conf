# lalcha.com: the website, signup and sign-in.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), serial=(), bluetooth=()" always;
# Scripts only from this site (plus Cloudflare's visitor counter); the live demo is the one frame allowed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.lalcha.com; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; frame-src https://demo.lalcha.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
